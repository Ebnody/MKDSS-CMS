{% extends "compliance/base.html" %}
{% block content %}
<section class="card">
    <div class="row">
        <div>
            <h1>{{ heading }}</h1>
            <p>Complete the document details and submit it through the normal review and approval workflow.</p>
        </div>
    </div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ meta.as_p }}
        {{ upload.as_p }}
        <button class="primary" type="submit">Save Draft</button>
        <a class="button" href="{% url 'dashboard' %}">Cancel</a>
    </form>
</section>
{% endblock %}
