{% extends "compliance/base.html" %}{% block content %}<h1>System Settings</h1><section class="card"><form method="post">{% csrf_token %}{{form.as_p}}<button class="primary">Save Setting</button></form></section><table><tr><th>Key</th><th>Value</th><th>Updated</th></tr>{% for s in settings %}<tr><td>{{s.key}}</td><td>{{s.value}}</td><td>{{s.updated_at}}</td></tr>{% endfor %}</table>{% endblock %}
