{% extends "compliance/base.html" %}{% block content %}<h1>Audit Log</h1><table><tr><th>Time</th><th>User</th><th>Action</th><th>Object</th><th>IP</th><th>Details</th></tr>{% for l in logs %}<tr><td>{{l.timestamp}}</td><td>{{l.user|default:"System"}}</td><td>{{l.action}}</td><td>{{l.object_type}} {{l.object_id}}</td><td>{{l.ip_address|default:"-"}}</td><td>{{l.details}}</td></tr>{% endfor %}</table>{% endblock %}
